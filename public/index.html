<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrokBot Andromeda</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__glyph" aria-hidden="true">✦</span>
          <div>
            <h1 class="brand__title">GrokBot Andromeda</h1>
            <p class="brand__subtitle">
              Chat assistant · <span id="mode-badge" class="badge">connecting…</span>
            </p>
          </div>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="message message--bot">
          <div class="message__bubble">
            Hi! I'm GrokBot Andromeda. Ask me anything to get started.
          </div>
        </div>
      </section>

      <form id="chat-form" class="composer" autocomplete="off">
        <input
          id="chat-input"
          class="composer__input"
          type="text"
          placeholder="Type a message…"
          aria-label="Message"
          required
        />
        <button id="send-button" class="composer__send" type="submit">Send</button>
      </form>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
